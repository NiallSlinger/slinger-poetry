<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLINGER - broadcast</title>
    <!-- Your global styles -->
    <link rel="stylesheet" href="styles.css"> 
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <style>
        .broadcast-container {
            position: relative; 
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        #broadcast-image {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        /* The Overlay - Positioned over the radio screen */
        .radio-screen-overlay {
            position: absolute;
            top: 46%;    
            left: 32%;   
            width: 29%;  
            height: 20%; 
            overflow: hidden; 
            background-color: #000;
            border: 0px solid #222;
            display: flex;
            align-items: center;
            z-index: 10;
        }

        /* The Scrolling Text */
        .scrolling-text {
            white-space: nowrap;
            color: #00ff00; 
            font-family: '000WebFont', sans-serif;
            text-transform: lowercase; 
            font-size: 1.2rem;
            /* Animation logic */
            animation: marquee 10s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">null</a>
        <a href="projects.html">projects</a>
        <a href="archive.html">archive</a>
        <a href="broadcast.html">broadcast</a>
        <a href="cells.html">cells</a>
        <a href="poetry.html">poetry</a>
        <a href="entry.html">entry</a>
    </nav>

    <div class="broadcast-container">
        <!-- The Main Image -->
        <img id="broadcast-image" src="radio.png" alt="Radio">
        
        <!-- The Text Overlay -->
        <div class="radio-screen-overlay">
            <div class="scrolling-text" id="ticker-text">
                establishing connection...
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const scriptLines = [
                "Establishing secure connection...",
                "Signal synchronized.",
                "The stone statue remains unmoved in the courtyard.",
                "System diagnostics report standard deviations.",
                "Awaiting further broadcast packets..."
            ];

            let currentLine = 0;
            const ticker = $('#ticker-text');
            
            function cycleText() {
                currentLine = (currentLine + 1) % scriptLines.length;
                ticker.text(scriptLines[currentLine]);
            }

            // Change the message every 10 seconds
            setInterval(cycleText, 10000);
        });
    </script>
</body>
</html>
