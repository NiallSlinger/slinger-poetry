<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLINGER - poetry broadcast</title>
    
    <!-- CSP HEADER: CLEAN ALLOWLIST -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; connect-src 'self' https://api.github.com data: blob:;">
    
    <link rel="stylesheet" href="styles.css?v=3">

    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: '000WebFont', monospace;
            text-transform: lowercase;
            padding: 20px;
        }

        /* CENTERED NAV FIX */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: black;
            text-align: center;
            padding: 1em 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #00ff00;
            text-decoration: none;
            margin: 0 1em;
            font-size: 1.2em; 
        }

        nav a:hover {
            text-decoration: underline;
        }

        .guestbook-container {
            max-width: 650px;
            margin: 40px auto;
        }

        .poem-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
            border: 1px solid #00ff00;
            padding: 20px;
        }

        input[type="text"], textarea {
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: '000WebFont', monospace;
            padding: 10px;
            font-size: 1rem;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-family: '000WebFont', monospace;
            cursor: pointer;
            text-transform: lowercase;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #00ff00;
            color: #000;
        }

        .entry-card {
            border: 1px dashed #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #050505;
        }

        .entry-header {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 10px;
            border-bottom: 1px dotted #00ff00;
            padding-bottom: 5px;
        }

        .entry-body {
            white-space: pre-wrap;
            line-height: 1.4;
        }
		.ascii-gpel {
            color: #00ff00;
            font-family: monospace, 'Courier New', Courier;
            white-space: pre;
            text-align: center;
            font-size: 1em;
            line-height: 1;
            margin: 15px auto;
            overflow: hidden !important;
            user-select: none;
        }
    </style>
</head>
<body>

<nav>
    <a href="https://slinger.neocities.org/index.html" target="_parent">null</a>
    <a href="https://slinger.neocities.org/projects.html" target="_parent">projects</a>
    <a href="https://slinger.neocities.org/archive.html" target="_parent">archive</a>
    <a href="https://slinger.neocities.org/broadcast.html" target="_parent">broadcast</a>
    <a href="https://slinger.neocities.org/cells.html" target="_parent">cells</a>
    <a href="https://slinger.neocities.org/poetry.html" target="_parent" class="active">g.p.e.l.</a>
    <a href="https://slinger.neocities.org/entry.html" target="_parent">o</a>
</nav>

    <div class="guestbook-container">
    <div class="ascii-gpel">
  ______    _____    _______           
 |  ____   |_____]   |______   |       
 |_____| . |       . |______ . |_____ .
                                       
    </div>
	<p>[guest poetry entry log]</p>
        <form class="poem-form" id="guestbook-form">
            <input type="text" id="author-input" placeholder="chosen name" required>
            <textarea id="poem-input" placeholder="leave a poem or sign of presence..." required></textarea>
            <button type="submit" id="submit-btn">transmit</button>
        </form>

        <div id="entries-list">loading transmissions...</div>
    </div>

    <script>
        // =====================================================================
        // GITHUB GIST CONFIGURATION FOR GPEL GUESTBOOK
        // =====================================================================
        const GITHUB_PAT = "YOUR_GPEL_GITHUB_PAT_HERE"; // e.g. ghp_...
        const GIST_ID = "YOUR_GPEL_GIST_ID_HERE";       // e.g. a1b2c3d4e5f6...
        const FILENAME = "guestbook_messages.json";

        const form = document.getElementById('guestbook-form');
        const entriesList = document.getElementById('entries-list');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        async function fetchPoems() {
            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    headers: { 'Accept': 'application/vnd.github+json' }
                });

                if (!res.ok) throw new Error("Failed to connect to transmission log.");

                const data = await res.json();
                const file = data.files && data.files[FILENAME];

                if (!file) {
                    entriesList.innerHTML = `<p>No transmissions stored yet.</p>`;
                    return;
                }

                const poems = JSON.parse(file.content);

                if (!Array.isArray(poems) || poems.length === 0) {
                    entriesList.innerHTML = `<p>No transmissions stored yet.</p>`;
                    return;
                }

                entriesList.innerHTML = poems.map(item => `
                    <div class="entry-card">
                        <div class="entry-header">
                            from: <strong>${escapeHtml(item.name)}</strong> | 
                            ${item.created_at ? new Date(item.created_at).toLocaleDateString() : 'recent'}
                        </div>
                        <div class="entry-body">${escapeHtml(item.poem)}</div>
                    </div>
                `).join('');
            } catch (error) {
                entriesList.innerHTML = `<p>Error loading logs: ${error.message}</p>`;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "transmitting...";
            submitBtn.disabled = true;

            const name = document.getElementById('author-input').value.trim();
            const poem = document.getElementById('poem-input').value.trim();
            const newEntry = {
                name,
                poem,
                created_at: new Date().toISOString()
            };

            try {
                // 1. Fetch current contents to avoid overwriting concurrent posts
                const getRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    headers: { 'Accept': 'application/vnd.github+json' }
                });
                
                if (!getRes.ok) throw new Error("Could not fetch existing log state.");
                
                const getData = await getRes.json();
                const currentContent = getData.files[FILENAME] ? JSON.parse(getData.files[FILENAME].content) : [];

                // 2. Prepend new entry so newest shows up first
                currentContent.unshift(newEntry);

                // 3. Patch the Gist with the updated array
                const patchRes = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Accept': 'application/vnd.github+json',
                        'Authorization': `Bearer ${GITHUB_PAT}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            [FILENAME]: {
                                content: JSON.stringify(currentContent, null, 2)
                            }
                        }
                    })
                });

                if (!patchRes.ok) throw new Error("Transmission failed server-side.");

                form.reset();
                fetchPoems();
            } catch (error) {
                alert("Failed to submit: " + error.message);
            } finally {
                submitBtn.innerText = "transmit";
                submitBtn.disabled = false;
            }
        });

        fetchPoems();
    </script>
</body>
</html>
