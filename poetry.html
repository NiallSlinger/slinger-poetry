	<p>[guest poetry entry log]</p>
        <form class="poem-form" id="guestbook-form">
            <input type="text" id="author-input" placeholder="chosen name" required>
            <textarea id="poem-input" placeholder="leave a poem or sign of presence..." required></textarea>
            <button type="submit" id="submit-btn">transmit</button>
        </form>

        <div id="entries-list">loading transmissions...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://zndzqourlurmfjljjwgt.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZHpxb3VybHVybWZqbGpqd2d0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NzYwODUsImV4cCI6MjEwNjQ1MjA4NX0.NCPW9H1Z6h0pYbpBsludjQ2cFb4chZEemvzoRV4ZihY"; 

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('guestbook-form');
        const entriesList = document.getElementById('entries-list');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        async function fetchPoems() {
            const { data, error } = await db
                .from('guestbook')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                entriesList.innerHTML = `<p>Error loading logs: ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                entriesList.innerHTML = `<p>No transmissions stored yet.</p>`;
                return;
            }

            entriesList.innerHTML = data.map(item => `
                <div class="entry-card">
                    <div class="entry-header">
                        from: <strong>${escapeHtml(item.name)}</strong> | 
                        ${new Date(item.created_at).toLocaleDateString()}
                    </div>
                    <div class="entry-body">${escapeHtml(item.poem)}</div>
                </div>
            `).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "transmitting...";
            submitBtn.disabled = true;

            const name = document.getElementById('author-input').value;
            const poem = document.getElementById('poem-input').value;

            const { error } = await db
                .from('guestbook')
                .insert([{ name, poem }]);

            if (error) {
                alert("Failed to submit: " + error.message);
            } else {
                form.reset();
                fetchPoems();
            }

            submitBtn.innerText = "transmit packet";
            submitBtn.disabled = false;
        });

        fetchPoems();
    </script>
</body>
